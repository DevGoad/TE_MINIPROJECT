<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Behavior Assessment</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>


    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        h1,
        h2 {
            text-align: center;
            color: #2c3e50;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .question-item {
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }

        .question-text {
            font-weight: 600;
            font-size: 1.1em;
            margin-bottom: 10px;
            display: block;
        }

        .options-container {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .option-label {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            background: #fafafa;
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid #ddd;
            transition: 0.2s;
        }

        .option-label:hover {
            background: #eef;
            border-color: #aaf;
        }

        input[type="radio"]:checked+span {
            font-weight: bold;
            color: #2980b9;
        }

        button {
            padding: 15px;
            border: none;
            font-size: 1.2em;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
            color: white;
        }

        button#submit-btn {
            width: 100%;
            background-color: #27ae60;
        }

        button#submit-btn:hover {
            background-color: #219150;
        }

        button#download-btn {
            background-color: #8e44ad;
            width: 48%;
            margin-top: 20px;
        }

        button#download-btn:hover {
            background-color: #732d91;
        }

        button#restart-btn {
            background-color: #7f8c8d;
            width: 48%;
            margin-top: 20px;
        }

        button#restart-btn:hover {
            background-color: #636e72;
        }

        #results-area {
            display: none;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #34495e;
            color: white;
        }

        .total-row {
            background-color: #ecf0f1;
            font-weight: bold;
        }

        .action-buttons {
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>

<body>

    <h1>Behavioral Assessment Questionnaire</h1>

    <div id="quiz-area" class="card">
        <p>Please answer all 54 questions based on how you generally feel or act.</p>
        <form id="questionnaire-form">
            <div id="questions-container">
                <p>Loading questions from server...</p>
            </div>
            <br>
            <button type="button" id="submit-btn" onclick="submitForm()" style="display:none;">Submit
                Assessment</button>
        </form>
    </div>

    <div id="results-area" class="card">
        <h2>Assessment Results</h2>
        <table id="score-table">
            <thead>
                <tr>
                    <th>Measure</th>
                    <th>Inclusion (I)</th>
                    <th>Control (C)</th>
                    <th>Affection (A)</th>
                    <th>Row Total</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <div
            style="margin-top: 30px; padding: 20px; background-color: #f8f9fa; border-left: 5px solid #3498db; border-radius: 4px;">
            <h3 style="color: #2c3e50; margin-top: 0;">AI Psychological Analysis</h3>
            <div id="ai-report-content" style="line-height: 1.6; color: #444;"></div>
        </div>

        <h3 style="text-align: center; margin-top: 20px;">Grand Total: <span id="grand-total"></span></h3>

        <div class="action-buttons">
            <button id="download-btn" onclick="generateReport()">Download PDF Report</button>
            <button id="restart-btn" onclick="location.reload()">Start Over</button>
        </div>
    </div>

    <div id="pdf-container" style="display: none;"></div>

    <script>
        const API_URL = "http://127.0.0.1:8000";
        let currentResultData = null;
        let currentAnswers = null;

        const SCALES = {
            "A": ["Never", "Rarely", "Occasionally", "Sometimes", "Often", "Usually"],
            "B": ["Nobody", "1 or 2 people", "A few people", "Some people", "Many people", "Most people"]
        };

        async function loadQuestions() {
            try {
                const response = await fetch(`${API_URL}/questions`);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

                const questions = await response.json();
                renderQuestions(questions);
                document.getElementById('submit-btn').style.display = 'block';
            } catch (error) {
                console.error("Fetch Error:", error);
                document.getElementById('questions-container').innerHTML = `<p style="color:red;">Error connecting to API.</p>`;
            }
        }

        function renderQuestions(questions) {
            const container = document.getElementById('questions-container');
            container.innerHTML = "";
            questions.forEach((q) => {
                const scaleLabels = SCALES[q.type];
                let optionsHTML = "";
                scaleLabels.forEach((label, i) => {
                    optionsHTML += `
                        <label class="option-label">
                            <input type="radio" name="q${q.id}" value="${i}" required>
                            <span>${label}</span>
                        </label>`;
                });
                container.innerHTML += `
                    <div class="question-item">
                        <span class="question-text">${q.id}. ${q.text}</span>
                        <div class="options-container">${optionsHTML}</div>
                    </div>`;
            });
        }

        async function submitForm() {
            const form = document.getElementById('questionnaire-form');
            if (!form.checkValidity()) {
                alert("Please answer all questions before submitting.");
                return;
            }

            const formData = new FormData(form);
            const answers = {};

            for (let [key, value] of formData.entries()) {
                answers[key.replace('q', '')] = parseInt(value);
            }

            currentAnswers = answers;

            document.getElementById('submit-btn').innerText = "Analyzing... Please wait";

            try {
                const response = await fetch(`${API_URL}/evaluate`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ answers: answers })
                });

                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

                const result = await response.json();
                currentResultData = result;
                showResults(result);
            } catch (error) {
                alert("Error calculating score. Check console.");
                console.error(error);
                document.getElementById('submit-btn').innerText = "Submit Assessment";
            }
        }

        // Formats Markdown to HTML
        function formatAIReport(reportString) {
            return reportString
                .replace(/^### (.*$)/gim, '<h3>$1</h3>')
                .replace(/^## (.*$)/gim, '<h2>$1</h2>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/\n\s*\*\s/g, '<br><br>&bull; ')
                .replace(/\n/g, '<br>');
        }

        function showResults(data) {
            document.getElementById('quiz-area').style.display = 'none';
            document.getElementById('results-area').style.display = 'block';

            const tbody = document.querySelector('#score-table tbody');
            const m = data.matrix, r = data.row_totals, c = data.col_totals;

            tbody.innerHTML = `
                <tr><td><strong>Expressed</strong></td><td>${m[0][0]}</td><td>${m[0][1]}</td><td>${m[0][2]}</td><td><strong>${r[0]}</strong></td></tr>
                <tr><td><strong>Wanted</strong></td><td>${m[1][0]}</td><td>${m[1][1]}</td><td>${m[1][2]}</td><td><strong>${r[1]}</strong></td></tr>
                <tr class="total-row"><td><strong>Total</strong></td><td><strong>${c[0]}</strong></td><td><strong>${c[1]}</strong></td><td><strong>${c[2]}</strong></td><td></td></tr>
            `;

            document.getElementById('ai-report-content').innerHTML = formatAIReport(data.ai_report);
            document.getElementById('grand-total').textContent = data.grand_total;
        }

        async function generateReport() {
            if (!currentAnswers) return;

            const btn = document.getElementById('download-btn');
            const originalText = btn.innerText;
            btn.innerText = "Generating PDF...";
            btn.disabled = true;

            try {
                // 1. Fetch the fully rendered HTML report from the server
                const response = await fetch(`${API_URL}/report`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ answers: currentAnswers })
                });

                if (!response.ok) {
                    const err = await response.text();
                    console.error("Report generation failed:", err);
                    alert("Report generation failed. Check console for details.");
                    return;
                }

                const fullyRenderedHtml = await response.text();

                // 2. Put it in our hidden div
                const pdfContainer = document.getElementById('pdf-container');
                pdfContainer.innerHTML = fullyRenderedHtml;
                pdfContainer.style.display = 'block';

                // 3. Configure html2pdf settings
                const opt = {
                    margin: 0,
                    filename: `FIRO_B_Report_${new Date().toLocaleDateString().replace(/\//g, '-')}.pdf`,
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { scale: 2 },
                    jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
                };

                // 4. Generate and download PDF
                await html2pdf().set(opt).from(pdfContainer).save();

                // 5. Cleanup
                pdfContainer.style.display = 'none';
                pdfContainer.innerHTML = '';

            } catch (err) {
                console.error("PDF Generation failed:", err);
                alert("Failed to generate PDF. Make sure the server is running.");
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }

        // Initialize
        loadQuestions();
    </script>
</body>

</html>
